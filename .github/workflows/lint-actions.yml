name: Lint GitHub Actions

on:
  pull_request:
    branches:
      - main

    paths:
      - '.github/workflows/*.yml'

  push:
    branches:
      - main

    paths:
      - '.github/workflows/*.yml'

permissions:
  contents: read

jobs:
  shellcheck:
    name: Run actionlint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
        shell: bash

      - name: Run actionlint
        run: |
          echo "::add-matcher::.github/matchers/actionlint.json"

          actionlint -color
        shell: bash
